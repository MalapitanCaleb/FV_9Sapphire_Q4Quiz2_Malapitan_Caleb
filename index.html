<!DOCTYPE html>
<html>
<head>
    <title>Score Analyzer</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #e0f7fa;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #0077b6;
            margin-bottom: 20px;
        }
        .subject {
            margin: 10px;
        }
        .result {
            font-size: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Score Analyzer</h1>
    <p>Enter your grades in the following subjects.</p>
    
    <button class="btn btn-info" onclick="toggleInstructions()">Instructions!</button>
    <p id="instructions" style="display:none;">Enter grades (70-100). Then click "Get Rating" to see your average and rating.</p>

    <div class="container">
        <div class="row">
            <div class="col subject">
                <label>Math:</label>
                <input type="number" id="math" class="form-control" min="70" max="100">
            </div>
            <div class="col subject">
                <label>English:</label>
                <input type="number" id="english" class="form-control" min="70" max="100">
            </div>
            <div class="col subject">
                <label>Science:</label>
                <input type="number" id="science" class="form-control" min="70" max="100">
            </div>
        </div>
    </div>

    <button class="btn btn-primary mt-3" onclick="getRating()">Get Rating</button>

    <div class="result" id="output"></div>

    <script>
        function toggleInstructions() {
            var x = document.getElementById("instructions");
            x.style.display = (x.style.display === "none") ? "block" : "none";
        }

        function getRating() {
            // Get values
            var e = parseFloat(document.getElementById('english').value);
            var s = parseFloat(document.getElementById('science').value);
            var m = parseFloat(document.getElementById('math').value);
            var avg = (e + s + m) / 3;
            var rating = "";

            if (avg >= 94 && avg <= 100) {
                rating = "Excellent";
            } else if (avg >= 87 && avg <= 93.99) {
                rating = "Above Satisfactory";
            } else if (avg >= 80 && avg <= 86.99) {
                rating = "Satisfactory";
            } else if (avg >= 75 && avg <= 79.99) {
                rating = "Needs Improvement";
            } else if (avg >= 70 && avg <= 74.99) {
                rating = "Poor";
            } else {
                rating = "Invalid grade entered.";
            }

            switch (true) {
                case (avg >= 94):
                    break;
                case (avg < 70):
                    alert("Some grades are below 70, which is invalid.");
                    break;
            }

            // Show result
            document.getElementById('output').innerHTML = 
                "Average: " + avg.toFixed(2) + "<br>Rating: " + rating;
        }
    </script>
    <footer class="bg-secondary text-light text-center p-3 mt-5">
      <small>&copy; 2025 Score Analyzer | Designed for Educational Use Only</small>
    </footer>
</body>
</html>
